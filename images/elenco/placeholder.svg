<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <rect width="400" height="600" fill="#0a1a0f"/>
  <rect width="400" height="600" fill="url(#grad)" opacity="0.6"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a5c32" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a1a0f" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <!-- Head -->
  <circle cx="200" cy="200" r="70" fill="#1a3a24" stroke="rgba(80,200,120,0.15)" stroke-width="2"/>
  <!-- Body -->
  <ellipse cx="200" cy="420" rx="110" ry="140" fill="#1a3a24" stroke="rgba(80,200,120,0.15)" stroke-width="2"/>
</svg>
